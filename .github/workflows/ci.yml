name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  plain-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only Markdown, text, JSON, YAML and images
        run: |
          bad=0
          while IFS= read -r f; do
            case "$f" in
              *.md|*.txt|*.json|*.yml|*.yaml|*.png|*.jpg|*.jpeg|*.gif|*.webp|*.ico|LICENSE|.gitignore) ;;
              *) echo "not an allowed type: $f"; bad=1 ;;
            esac
            if head -c 2 "$f" | grep -q '^#!'; then echo "starts with #!: $f"; bad=1; fi
            case "$f" in
              *.png|*.jpg|*.jpeg|*.gif|*.webp|*.ico) ;;
              *) if LC_ALL=C grep -q -P '\x00' "$f"; then echo "NUL byte: $f"; bad=1; fi
                 iconv -f UTF-8 -t UTF-8 "$f" > /dev/null 2>&1 || { echo "not UTF-8: $f"; bad=1; } ;;
            esac
          done < <(git ls-files)
          exit $bad
      - name: JSON parses
        run: for f in $(git ls-files '*.json'); do python3 -m json.tool "$f" > /dev/null || exit 1; done
